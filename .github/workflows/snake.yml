name: Generate contribution snake

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate REST themed snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#9B6500&color_dots=#EBEDF0,#FDF0C0,#F9D76E,#F4BD32,#9B6500
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F4BD32&color_dots=#0D1117,#3A2B08,#72520C,#B78318,#F4BD32

      - name: Publish generated assets to gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
