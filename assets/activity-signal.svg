      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="23" stroke="#F4BD32" stroke-opacity="0.18"/>
