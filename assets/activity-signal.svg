<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="pulse" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4BD32" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#F4BD32" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#FFF2A6"/>
      <stop offset="0.8" stop-color="#F4BD32" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F4BD32" stop-opacity="0"/>
