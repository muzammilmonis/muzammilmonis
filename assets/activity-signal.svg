  <text x="54" y="56" fill="#F4BD32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.3">MUZAMMIL MONIS // ACTIVITY SIGNAL</text>
  <text x="1146" y="56" text-anchor="end" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">SELF-HOSTED PROFILE VISUAL</text>

  <path d="M62 145H145L160 145L172 128L186 164L202 104L218 180L234 137L250 145H365L378 145L390 131L403 161L416 114L430 173L444 145H560L574 145L587 120L600 170L616 95L632 183L648 133L664 145H790L804 145L818 126L831 164L846 111L862 176L878 139L894 145H1138" stroke="url(#pulse)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" stroke-dasharray="1500" stroke-dashoffset="1500">
    <animate attributeName="stroke-dashoffset" values="1500;0;-1500" dur="7s" repeatCount="indefinite"/>
