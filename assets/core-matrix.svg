<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset=".5" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#F4BD32" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F4BD32" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F4BD32" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 165) rotate(90) scale(96)">
      <stop stop-color="#FFF2A6" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#F4BD32" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F4BD32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#F4BD32" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" stroke="#F4BD32" stroke-opacity=".2"/>
  <rect x="18" y="18" width="1164" height="294" rx="16" fill="url(#grid)"/>

  <path d="M40 48H1160" stroke="url(#beam)" stroke-width="2" stroke-dasharray="160 920">
    <animate attributeName="stroke-dashoffset" values="1080;-1080" dur="5.8s" repeatCount="indefinite"/>
  </path>
  <path d="M40 282H1160" stroke="url(#beam)" stroke-width="2" stroke-dasharray="120 960">
    <animate attributeName="stroke-dashoffset" values="-1080;1080" dur="7.2s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="78" fill="#F4BD32" font-size="14" font-weight="700" letter-spacing="2">CORE_MATRIX / REST STUDIO</text>
    <text x="54" y="105" fill="#7D8590" font-size="12" letter-spacing="1">BUILD LAYER</text>

    <g transform="translate(54 127)">
      <text x="0" y="0" fill="#C9D1D9" font-size="13">JAVA / PAPER / VELOCITY</text>
      <rect x="0" y="13" width="292" height="5" rx="2.5" fill="#21262D"/>
      <rect x="0" y="13" width="250" height="5" rx="2.5" fill="#F4BD32">
        <animate attributeName="width" values="34;250;230;250" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(54 178)">
      <text x="0" y="0" fill="#C9D1D9" font-size="13">NODE / APIs / AUTOMATION</text>
      <rect x="0" y="13" width="292" height="5" rx="2.5" fill="#21262D"/>
      <rect x="0" y="13" width="268" height="5" rx="2.5" fill="#F4BD32">
        <animate attributeName="width" values="70;268;244;268" dur="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(54 229)">
      <text x="0" y="0" fill="#C9D1D9" font-size="13">LINUX / NETWORKS / INFRA</text>
      <rect x="0" y="13" width="292" height="5" rx="2.5" fill="#21262D"/>
      <rect x="0" y="13" width="238" height="5" rx="2.5" fill="#F4BD32">
        <animate attributeName="width" values="50;238;212;238" dur="5.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(600 165)">
    <circle r="102" fill="url(#core)" opacity=".35">
      <animate attributeName="opacity" values=".18;.42;.18" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="86" stroke="#F4BD32" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 11">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="68" stroke="#F4BD32" stroke-opacity=".45" stroke-width="2" stroke-dasharray="18 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="#0B1118" stroke="#F4BD32" stroke-opacity=".75" filter="url(#glow)"/>
    <circle r="34" fill="#F4BD32" fill-opacity=".06" stroke="#F4BD32" stroke-opacity=".24"/>
    <text y="-4" text-anchor="middle" fill="#F4BD32" font-family="Arial Black, Inter, Arial" font-size="17" font-weight="900" letter-spacing="3">VOID</text>
    <text y="17" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, monospace" font-size="8" letter-spacing="2">CORE ONLINE</text>
    <circle cx="0" cy="-68" r="4" fill="#F4BD32">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="845" y="78" fill="#F4BD32" font-size="14" font-weight="700" letter-spacing="2">SIGNAL STATUS</text>

    <g transform="translate(845 109)">
      <circle cx="5" cy="5" r="5" fill="#3FB950"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#C9D1D9" font-size="13">REST NETWORK</text>
      <text x="260" y="10" text-anchor="end" fill="#3FB950" font-size="12">ACTIVE</text>
    </g>
    <g transform="translate(845 148)">
      <circle cx="5" cy="5" r="5" fill="#F4BD32"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#C9D1D9" font-size="13">EXPERIMENTS</text>
      <text x="260" y="10" text-anchor="end" fill="#F4BD32" font-size="12">BUILDING</text>
    </g>
    <g transform="translate(845 187)">
      <circle cx="5" cy="5" r="5" fill="#58A6FF"><animate attributeName="opacity" values="1;.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#C9D1D9" font-size="13">AUTOMATION</text>
      <text x="260" y="10" text-anchor="end" fill="#58A6FF" font-size="12">SYNCED</text>
    </g>

    <rect x="845" y="225" width="260" height="34" rx="8" fill="#F4BD32" fill-opacity=".055" stroke="#F4BD32" stroke-opacity=".22"/>
    <text x="975" y="247" text-anchor="middle" fill="#8B949E" font-size="11" letter-spacing="1.4">SHIP &gt; TALK ABOUT SHIPPING</text>
  </g>

  <g fill="#F4BD32">
    <circle cx="380" cy="90" r="2"><animate attributeName="cx" values="380;455;380" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="805" cy="246" r="2"><animate attributeName="cx" values="805;745;805" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="265" r="1.5"><animate attributeName="cy" values="265;225;265" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="88" r="1.5"><animate attributeName="cy" values="88;128;88" dur="4.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
