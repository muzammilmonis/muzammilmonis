<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260">
      <stop stop-color="#05070B"/>
      <stop offset=".5" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4BD32" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF2A6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#F4BD32" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cells" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="13" height="13" rx="2.5" fill="#F4BD32" fill-opacity=".78" stroke="#FFF2A6" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="gridClip"><rect x="104" y="74" width="954" height="126" rx="9"/></clipPath>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="23" fill="none" stroke="#F4BD32" stroke-opacity=".18"/>

  <text x="60" y="42" fill="#F4BD32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.4">PROFILE MATRIX // FULL VISUAL MODE</text>
  <text x="1140" y="42" text-anchor="end" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">CUSTOM DISPLAY • NOT GITHUB HISTORY</text>

  <text x="63" y="92" fill="#7D8590" font-family="ui-monospace, monospace" font-size="10">MON</text>
  <text x="63" y="128" fill="#7D8590" font-family="ui-monospace, monospace" font-size="10">WED</text>
  <text x="63" y="164" fill="#7D8590" font-family="ui-monospace, monospace" font-size="10">FRI</text>

  <g clip-path="url(#gridClip)">
    <rect x="104" y="74" width="954" height="126" fill="url(#cells)"/>
    <rect x="40" y="68" width="160" height="140" fill="url(#scan)" filter="url(#glow)">
      <animate attributeName="x" values="40;1040;40" dur="5.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7D8590">
    <text x="110" y="222">JAN</text><text x="196" y="222">FEB</text><text x="282" y="222">MAR</text><text x="368" y="222">APR</text>
    <text x="454" y="222">MAY</text><text x="540" y="222">JUN</text><text x="626" y="222">JUL</text><text x="712" y="222">AUG</text>
    <text x="798" y="222">SEP</text><text x="884" y="222">OCT</text><text x="970" y="222">NOV</text><text x="1038" y="222">DEC</text>
  </g>

  <g transform="translate(1086 83)" font-family="ui-monospace, monospace">
    <rect width="72" height="112" rx="10" fill="#F4BD32" fill-opacity=".05" stroke="#F4BD32" stroke-opacity=".18"/>
    <text x="36" y="24" text-anchor="middle" fill="#7D8590" font-size="8" letter-spacing="1">LOAD</text>
    <text x="36" y="53" text-anchor="middle" fill="#F4BD32" font-size="22" font-weight="700">100%</text>
    <circle cx="36" cy="79" r="7" fill="#3FB950">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="102" text-anchor="middle" fill="#C9D1D9" font-size="8">ONLINE</text>
  </g>
</svg>
