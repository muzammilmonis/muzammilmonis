<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset="0.48" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="gold" x1="220" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B6500"/>
      <stop offset="0.25" stop-color="#F4BD32"/>
      <stop offset="0.5" stop-color="#FFF2A6"/>
      <stop offset="0.75" stop-color="#F4BD32"/>
      <stop offset="1" stop-color="#9B6500"/>
      <animate attributeName="x1" values="-200;650;-200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;1450;600" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#F4BD32" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="324" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1164" height="324" fill="url(#grid)"/>
    <circle cx="105" cy="40" r="170" fill="#F4BD32" fill-opacity="0.035" filter="url(#soft)">
      <animate attributeName="cx" values="105;280;105" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="330" r="185" fill="#F4BD32" fill-opacity="0.04" filter="url(#soft)">
      <animate attributeName="cy" values="330;220;330" dur="11s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.9">
      <path d="M80 82 H332" stroke="#F4BD32" stroke-opacity="0.28"/>
      <path d="M868 82 H1120" stroke="#F4BD32" stroke-opacity="0.28"/>
      <path d="M80 278 H340" stroke="#F4BD32" stroke-opacity="0.18"/>
      <path d="M860 278 H1120" stroke="#F4BD32" stroke-opacity="0.18"/>
      <circle cx="68" cy="82" r="3" fill="#F4BD32"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="1132" cy="82" r="3" fill="#F4BD32"><animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
    </g>

    <g fill="#F4BD32">
      <circle cx="155" cy="122" r="2"><animate attributeName="cy" values="122;65;122" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="1015" cy="238" r="2"><animate attributeName="cy" values="238;290;238" dur="5.4s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="292" r="1.5"><animate attributeName="cx" values="230;345;230" dur="6.1s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="116" r="1.5"><animate attributeName="cx" values="930;815;930" dur="6.8s" repeatCount="indefinite"/></circle>
    </g>

    <text x="600" y="72" text-anchor="middle" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="6">SYSTEM PROFILE // ONLINE</text>

    <text x="600" y="169" text-anchor="middle" fill="url(#gold)" filter="url(#glow)" font-family="Arial Black, Inter, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="10">MUZAMMIL</text>
    <text x="600" y="215" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700" letter-spacing="7">MUZAMMIL MONIS</text>
    <text x="600" y="252" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3">REST STUDIO • SERVERS • TOOLS • AUTOMATION</text>

    <g transform="translate(453 290)">
      <rect width="294" height="34" rx="17" fill="#F4BD32" fill-opacity="0.08" stroke="#F4BD32" stroke-opacity="0.33"/>
      <circle cx="18" cy="17" r="5" fill="#3FB950"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="34" y="22" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">BUILDING WHAT SHOULD EXIST</text>
    </g>

    <rect x="0" y="-80" width="1200" height="42" fill="#F4BD32" fill-opacity="0.025">
      <animate attributeName="y" values="-80;390" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="18.5" y="18.5" width="1163" height="323" rx="21.5" stroke="#F4BD32" stroke-opacity="0.20"/>
  <path d="M42 42 H125 M42 42 V92 M1158 42 H1075 M1158 42 V92 M42 318 H125 M42 318 V268 M1158 318 H1075 M1158 318 V268" stroke="#F4BD32" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>